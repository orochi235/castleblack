[project]
name = "pezlie-host-unicode"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pezlie[routes,feed]", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
pezlie = { path = "../../bakery", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
