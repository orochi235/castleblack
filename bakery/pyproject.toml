[project]
name = "pezlie"
version = "0.2.0"
description = "Bake per-item renders into a mip chain of sprite sheets, and serve them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "orochi235" }]
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.urls]
Repository = "https://github.com/orochi235/pezlie"

[project.optional-dependencies]
routes = ["fastapi>=0.110"]
feed = ["pyarrow>=15"]
test = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "pyarrow>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pezlie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
